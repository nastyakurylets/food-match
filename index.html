<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Food Match</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0808;
    --card-bg: #1c1010;
    --accent: #c0392b;
    --accent2: #e74c3c;
    --like: #27ae60;
    --nope: #c0392b;
    --text: #f5f0ee;
    --muted: rgba(245,240,238,0.5);
    --tag-bg: rgba(255,255,255,0.1);
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Manrope", sans-serif; touch-action: none; }

  /* ── PHONE SCREEN ── */
  #phoneScreen {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    gap: 0;
    animation: fadeIn 0.4s ease;
  }
  .phone-logo {
    font-family: "Unbounded", sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .phone-logo span { color: var(--accent2); }
  .phone-tagline {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 48px;
  }
  .phone-title {
    font-family: "Unbounded", sans-serif;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .phone-sub {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    line-height: 1.65;
    max-width: 280px;
    margin-bottom: 36px;
  }
  .phone-input-wrap {
    width: 100%;
    max-width: 320px;
    position: relative;
    margin-bottom: 14px;
  }
  .phone-prefix {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    pointer-events: none;
  }
  .phone-input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 16px 16px 16px 44px;
    color: var(--text);
    font-family: "Manrope", sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1.5px;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .phone-input:focus { border-color: var(--accent2); }
  .phone-input::placeholder { color: rgba(255,255,255,0.25); font-weight: 400; letter-spacing: 0; }
  .phone-error {
    font-size: 12px;
    color: var(--accent2);
    min-height: 18px;
    margin-bottom: 20px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .phone-error.visible { opacity: 1; }
  .start-btn {
    width: 100%;
    max-width: 320px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    padding: 17px;
    color: #fff;
    font-family: "Unbounded", sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .start-btn:hover { background: var(--accent2); }
  .start-btn:active { transform: scale(0.97); }
  .phone-privacy {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    margin-top: 16px;
    text-align: center;
    max-width: 260px;
    line-height: 1.5;
  }

  /* ── SWIPE APP ── */
  #app {
    height: 100dvh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 28px;
    max-width: 480px;
    margin: 0 auto;
    animation: fadeIn 0.4s ease;
  }
  #app.visible { display: flex; }

  .header { width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: "Unbounded", sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 2px; }
  .logo span { color: var(--accent2); }
  .progress-dots { display: flex; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.3s; }
  .dot.done { background: var(--accent2); }
  .dot.current { background: var(--text); transform: scale(1.2); }

  .card-area { position: relative; width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; margin: 16px 0; }

  .swipe-card { position: absolute; width: 100%; max-width: 380px; border-radius: 24px; overflow: hidden; cursor: grab; will-change: transform; user-select: none; -webkit-user-select: none; background: var(--card-bg); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .swipe-card:active { cursor: grabbing; }
  .swipe-card.back { transform: scale(0.94) translateY(12px); filter: brightness(0.7); pointer-events: none; z-index: 1; transition: transform 0.35s cubic-bezier(.34,1.4,.64,1), filter 0.35s; }
  .swipe-card.top { z-index: 2; transition: none; }
  .swipe-card.top.animating { transition: transform 0.4s cubic-bezier(.4,0,.2,1), opacity 0.4s; }
  .swipe-card.promoting { transition: transform 0.35s cubic-bezier(.34,1.4,.64,1), filter 0.35s; }

  .card-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
  .card-body { padding: 16px 18px 18px; }
  .card-name { font-family: "Unbounded", sans-serif; font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 10px; line-height: 1.25; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 500; padding: 4px 11px; border-radius: 20px; background: var(--tag-bg); color: var(--muted); border: 0.5px solid rgba(255,255,255,0.12); }

  .hint { position: absolute; top: 22px; font-family: "Unbounded", sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 3px; padding: 8px 16px; border-radius: 8px; border-width: 3px; border-style: solid; opacity: 0; pointer-events: none; z-index: 10; transition: opacity 0.05s; }
  .hint-like { right: 20px; color: var(--like); border-color: var(--like); transform: rotate(10deg); }
  .hint-nope { left: 20px; color: var(--nope); border-color: var(--nope); transform: rotate(-10deg); }

  .btn-row { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; }
  .btn { border: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; flex-shrink: 0; }
  .btn:active { transform: scale(0.88) !important; }
  .btn-nope { width: 64px; height: 64px; background: rgba(192,57,43,0.18); border: 2px solid var(--nope); }
  .btn-like { width: 72px; height: 72px; background: rgba(39,174,96,0.18); border: 2px solid var(--like); box-shadow: 0 0 30px rgba(39,174,96,0.2); }
  .btn-skip { width: 48px; height: 48px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); }

  /* ── RESULT ── */
  #resultScreen { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; width: 100%; height: 100%; animation: fadeIn 0.5s ease; padding: 24px; }
  #resultScreen.visible { display: flex; }
  .result-badge { font-size: 64px; margin-bottom: 4px; }
  .result-title { font-family: "Unbounded", sans-serif; font-size: 22px; font-weight: 900; color: var(--text); line-height: 1.25; }
  .result-sub { font-size: 14px; color: var(--muted); max-width: 300px; line-height: 1.65; }
  .result-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
  .result-tag { font-size: 12px; font-weight: 600; padding: 6px 16px; border-radius: 20px; background: rgba(192,57,43,0.25); color: #ff8a7a; border: 1px solid rgba(192,57,43,0.4); }
  .bonus-pill { background: rgba(39,174,96,0.18); border: 1px solid rgba(39,174,96,0.4); color: #6fcf97; font-size: 13px; font-weight: 600; padding: 8px 20px; border-radius: 30px; }
  .send-status { font-size: 12px; color: var(--muted); min-height: 18px; }
  .restart-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: var(--muted); font-family: "Manrope", sans-serif; font-size: 13px; padding: 10px 24px; border-radius: 30px; cursor: pointer; transition: background 0.2s; }
  .restart-btn:hover { background: rgba(255,255,255,0.14); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- PHONE SCREEN -->
<div id="phoneScreen">
  <div class="phone-logo">FOOD<span>MATCH</span></div>
  <div class="phone-tagline">Смаковий профіль через свайпи</div>
  <div class="phone-title">Введи номер телефону,<br>щоб почати</div>
  <div class="phone-sub">Ми надішлемо тобі персональну рекомендацію!</div>
  <div class="phone-input-wrap">
    <span class="phone-prefix">+38</span>
    <input class="phone-input" id="phoneInput" type="tel" inputmode="numeric" placeholder="0XX XXX XX XX" maxlength="13">
  </div>
  <div class="phone-error" id="phoneError">Введи коректний номер</div>
  <button class="start-btn" id="startBtn">Почати гру →</button>
  <div class="phone-privacy">Номер використовується лише для надсилання рекомендації та збереження ваших уподобань</div>
</div>

<!-- SWIPE APP -->
<div id="app">
  <div class="header" id="header">
    <div class="logo">FOOD<span>MATCH</span></div>
    <div class="progress-dots" id="dots"></div>
  </div>
  <div class="card-area" id="cardArea"></div>
  <div id="resultScreen">
    <div class="result-badge" id="resEmoji"></div>
    <div class="result-title" id="resTitle"></div>
    <div class="result-sub" id="resDesc"></div>
    <div class="result-tags" id="resTags"></div>
    <div class="send-status" id="sendStatus"></div>
    <button class="restart-btn" id="restartBtn">Пройти знову</button>
  </div>
  <div class="btn-row" id="btnRow">
    <button class="btn btn-skip" id="btnSkip">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.18-5.5"/></svg>
    </button>
    <button class="btn btn-nope" id="btnNope">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="btn btn-like" id="btnLike">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="#27ae60" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>
</div>

  classic: { emoji: "🥘", title: "Класичний гурман", desc: "Тобі важливий смак і традиції. Ти обираєш перевірені страви з характером і не боїшся наваристого." },
  hearty:  { emoji: "🥩", title: "М'ясоїд", desc: "Ситне, соковите, з диму — ось твоя мова любові." },
  light:   { emoji: "🐟", title: "Легкий естет", desc: "Ти цінуєш баланс і свіжість. Риба, гриль, зелень — їжа як мистецтво." },
  spicy:   { emoji: "🌶", title: "Любитель гострого", desc: "Без перцю — не їжа. Азійські спеції та мексиканський запал — твоя стихія." },
  sweet:   { emoji: "🍫", title: "Солодкоїжка", desc: "Десерт — це окрема їжа, а не нагорода. Ти знаєш де найкращий шоколад у місті." },
};

let userPhone = "";
let idx = 0, likes = [], dislikes = [];
let shuffled = [...dishes].sort(() => Math.random() - 0.5);
let isDragging = false, startX = 0, curX = 0, swipeTime = 0;
let topCard = null;
const TOTAL = shuffled.length;

// ── Phone screen ──
const phoneInput = document.getElementById("phoneInput");
const phoneError = document.getElementById("phoneError");
const startBtn   = document.getElementById("startBtn");

phoneInput.addEventListener("input", () => {
  let v = phoneInput.value.replace(/\D/g, "");
  if (v.startsWith("380")) v = v.slice(2);
  if (v.startsWith("38"))  v = v.slice(2);
  if (v.startsWith("0"))   v = v.slice(1);
  let fmt = "";
  if (v.length > 0) fmt = "0" + v.slice(0,2);
  if (v.length > 2) fmt += " " + v.slice(2,5);
  if (v.length > 5) fmt += " " + v.slice(5,7);
  if (v.length > 7) fmt += " " + v.slice(7,9);
  phoneInput.value = fmt;
  phoneError.classList.remove("visible");
});

startBtn.addEventListener("click", () => {
  const raw = phoneInput.value.replace(/\D/g, "");
  if (raw.length < 9) { phoneError.classList.add("visible"); return; }
  userPhone = "+38" + (raw.startsWith("0") ? raw : "0" + raw);
  document.getElementById("phoneScreen").style.display = "none";
  document.getElementById("app").classList.add("visible");
  renderCards();
});

phoneInput.addEventListener("keydown", e => { if (e.key === "Enter") startBtn.click(); });

// ── Cards ──
const cardArea  = document.getElementById("cardArea");
const dotsEl    = document.getElementById("dots");
const btnNope   = document.getElementById("btnNope");
const btnLike   = document.getElementById("btnLike");
const btnSkip   = document.getElementById("btnSkip");
const resultScreen = document.getElementById("resultScreen");
const btnRow    = document.getElementById("btnRow");
const header    = document.getElementById("header");

function buildDots() {
  dotsEl.innerHTML = "";
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < idx ? " done" : i === idx ? " current" : "");
    dotsEl.appendChild(d);
  }
}

function makeCard(dish, isTop) {
  const card = document.createElement("div");
  card.className = "swipe-card " + (isTop ? "top" : "back");
  card.innerHTML = `
    <div class="hint hint-like">СМАК</div>
    <div class="hint hint-nope">НІ</div>
    <img class="card-img" src="${dish.img}" draggable="false" alt="${dish.name}">
    <div class="card-body">
      <div class="card-name">${dish.name}</div>
      <div class="card-tags">${dish.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>
    </div>`;
  return card;
}

function renderCards() {
  cardArea.innerHTML = "";
  if (idx >= TOTAL) { showResult(); return; }
  const backDish = shuffled[idx + 1];
  if (backDish) cardArea.appendChild(makeCard(backDish, false));
  const top = makeCard(shuffled[idx], true);
  cardArea.appendChild(top);
  topCard = top;
  buildDots();
  addDrag(top);
}

function addDrag(card) {
  const lh = card.querySelector(".hint-like");
  const nh = card.querySelector(".hint-nope");
  function onStart(x) { isDragging = true; startX = x; curX = 0; swipeTime = Date.now(); card.classList.remove("animating"); }
  function onMove(x) {
    if (!isDragging) return;
    curX = x - startX;
    card.style.transform = `translateX(${curX}px) rotate(${curX * 0.07}deg)`;
    lh.style.opacity = curX > 20 ? Math.min((curX - 20) / 60, 1) : 0;
    nh.style.opacity = curX < -20 ? Math.min((-curX - 20) / 60, 1) : 0;
  }
  function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    lh.style.opacity = 0; nh.style.opacity = 0;
    if (Date.now() - swipeTime < 150 && Math.abs(curX) > 60) { card.style.transform = ""; return; }
    if (curX > 90) doSwipe("like");
    else if (curX < -90) doSwipe("nope");
    else { card.style.transform = ""; curX = 0; }
  }
  card.addEventListener("mousedown",  e => onStart(e.clientX));
  window.addEventListener("mousemove", e => { if (isDragging) onMove(e.clientX); });
  window.addEventListener("mouseup",   () => { if (isDragging) onEnd(); });
  card.addEventListener("touchstart", e => onStart(e.touches[0].clientX), { passive: true });
  card.addEventListener("touchmove",  e => { if (isDragging) { onMove(e.touches[0].clientX); e.preventDefault(); } }, { passive: false });
  card.addEventListener("touchend",   () => { if (isDragging) onEnd(); });
}

function doSwipe(dir) {
  if (!topCard) return;
  const card = topCard;
  const dish = shuffled[idx];
  if (dir === "like") { likes.push(dish.name); card.classList.add("animating"); card.style.transform = "translateX(140%) rotate(20deg)"; card.style.opacity = "0"; }
  else { dislikes.push(dish.name); card.classList.add("animating"); card.style.transform = "translateX(-140%) rotate(-20deg)"; card.style.opacity = "0"; }
  const back = cardArea.querySelector(".back");
  if (back) back.classList.add("promoting");
  idx++;
  setTimeout(renderCards, 360);
}

btnLike.onclick = () => { if (topCard && idx < TOTAL) doSwipe("like"); };
btnNope.onclick = () => { if (topCard && idx < TOTAL) doSwipe("nope"); };
btnSkip.onclick = () => { if (topCard && idx < TOTAL) doSwipe("nope"); };

document.getElementById("restartBtn").onclick = () => {
  idx = 0; likes = []; dislikes = [];
  shuffled = [...dishes].sort(() => Math.random() - 0.5);
  resultScreen.classList.remove("visible");
  btnRow.style.display = "flex"; cardArea.style.display = "flex"; header.style.display = "flex";
  renderCards();
};

// ── Result + send to Sheets ──
function showResult() {
  topCard = null;
  cardArea.style.display = "none"; btnRow.style.display = "none"; header.style.display = "none";
  const counts = {};
  likes.forEach(name => { const d = dishes.find(x => x.name === name); if (d) counts[d.archetype] = (counts[d.archetype] || 0) + 1; });
  let best = "classic", max = 0;
  for (const [k, v] of Object.entries(counts)) { if (v > max) { max = v; best = k; } }
  const a = archetypes[best];
  document.getElementById("resEmoji").textContent = a.emoji;
  document.getElementById("resTitle").textContent = a.title;
  document.getElementById("resDesc").textContent  = a.desc;
  document.getElementById("resTags").innerHTML = likes.map(n => `<span class="result-tag">${n}</span>`).join("");
  resultScreen.classList.add("visible");
  sendToSheets({ phone: userPhone, archetype: a.title, likes: likes.join(", "), dislikes: dislikes.join(", "), time: new Date().toLocaleString("uk-UA") });
}

function sendToSheets(data) {
  const status = document.getElementById("sendStatus");
  if (!SHEET_URL || SHEET_URL === "YOUR_GOOGLE_SCRIPT_URL_HERE") {
    status.textContent = "⚠️ URL Google Script не вказано";
    return;
  }
  status.textContent = "Надсилаємо дані...";
  const params = new URLSearchParams(data);
  fetch(SHEET_URL + "?" + params.toString(), { method: "GET", mode: "no-cors" })
    .then(() => { status.textContent = "✓ Дані збережено"; })
    .catch(() => { status.textContent = "⚠️ Не вдалося надіслати"; });
}
